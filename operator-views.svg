<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-label="A hooded operator with a glowing green visor holding a card that says: intel report, you are visitor number">
  <title>Operator profile view counter</title>
  <defs>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="visorClip"><rect x="98" y="62" width="44" height="14" rx="7"/></clipPath>
  </defs>

  <!-- panel -->
  <rect x="2" y="2" width="416" height="226" rx="16" fill="#0d1117" stroke="#39FF14" stroke-opacity="0.55" stroke-width="2"/>
  <!-- faint grid -->
  <g stroke="#39FF14" stroke-opacity="0.07">
    <path d="M20 40H400M20 80H400M20 120H400M20 160H400M20 200H400"/>
    <path d="M60 14V216M120 14V216M180 14V216M240 14V216M300 14V216M360 14V216"/>
  </g>

  <!-- floor shadow -->
  <ellipse cx="120" cy="209" rx="74" ry="8" fill="#1c2430"/>

  <!-- legs and boots -->
  <rect x="88" y="168" width="24" height="38" rx="9" fill="#1a212b"/>
  <rect x="128" y="168" width="24" height="38" rx="9" fill="#1a212b"/>
  <rect x="82" y="196" width="34" height="13" rx="6" fill="#0f141a"/>
  <rect x="124" y="196" width="34" height="13" rx="6" fill="#0f141a"/>

  <!-- operator (gentle idle motion) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="2.6s" repeatCount="indefinite"/>

    <!-- resting arm -->
    <rect x="52" y="108" width="20" height="62" rx="10" fill="#232c3a"/>
    <circle cx="62" cy="174" r="9" fill="#0f141a"/>

    <!-- torso -->
    <rect x="68" y="100" width="104" height="78" rx="20" fill="#232c3a"/>
    <rect x="86" y="112" width="68" height="44" rx="8" fill="#1a212b" stroke="#39FF14" stroke-opacity="0.6"/>
    <rect x="92" y="136" width="18" height="14" rx="3" fill="#232c3a"/>
    <rect x="130" y="136" width="18" height="14" rx="3" fill="#232c3a"/>
    <rect x="86" y="160" width="68" height="6" rx="3" fill="#39FF14" opacity="0.8"/>

    <!-- hood and face plate -->
    <circle cx="120" cy="68" r="40" fill="#232c3a"/>
    <rect x="90" y="46" width="60" height="46" rx="18" fill="#0f141a"/>

    <!-- glowing visor with a scanning highlight -->
    <rect x="98" y="62" width="44" height="14" rx="7" fill="#39FF14" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.75;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <g clip-path="url(#visorClip)">
      <rect x="-10" y="60" width="10" height="18" fill="#ffffff" opacity="0.55">
        <animate attributeName="x" values="94;146" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- mouth vent -->
    <path d="M108 82H132M110 86H130" stroke="#39FF14" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>

    <!-- headset and antenna -->
    <rect x="82" y="62" width="9" height="20" rx="4" fill="#1a212b" stroke="#39FF14" stroke-opacity="0.6"/>
    <path d="M86 62V40" stroke="#39FF14" stroke-opacity="0.8" stroke-width="2"/>
    <circle cx="86" cy="37" r="3.5" fill="#39FF14">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- report card -->
  <g transform="translate(196 34)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 0 126; -1 0 126; -3 0 126" dur="2.6s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="204" height="126" rx="10" fill="#fffdf0" stroke="#39FF14" stroke-width="3"/>
      <rect x="1.5" y="1.5" width="201" height="26" rx="9" fill="#39FF14"/>
      <rect x="1.5" y="16" width="201" height="11" fill="#39FF14"/>
      <text x="102" y="19" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" letter-spacing="3" fill="#0d1117">INTEL REPORT</text>
      <text x="102" y="56" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="17" font-weight="bold" fill="#0d1117">HEY, VISITOR!</text>
      <text x="102" y="83" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="bold" fill="#0d1117">PROFILE VIEWS LOGGED</text>
      <text x="70" y="108" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="bold" fill="#0d1117">SO FAR</text>
      <text x="146" y="108" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="17" font-weight="bold" fill="#1f9d00">&gt;&gt;&gt;
        <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- raised arm holding the card -->
  <rect x="166" y="112" width="20" height="56" rx="10" transform="rotate(-32 176 140)" fill="#232c3a"/>
  <circle cx="196" cy="150" r="10" fill="#0f141a"/>
</svg>
